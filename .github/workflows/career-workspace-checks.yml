name: Career Workspace Checks

on:
  pull_request:
    paths:
      - 'backend/job_service/app/routers/career.py'
      - 'backend/job_service/app/models.py'
      - 'backend/job_service/app/database.py'
      - 'backend/job_service/tests/test_career*.py'
      - 'backend/api_gateway/app/routes/career*.py'
      - 'backend/api_gateway/tests/test_career*.py'
      - '.github/workflows/career-workspace-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  job-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install job-service test dependencies
        run: >-
          python -m pip install -r backend/job_service/requirements.txt
          aiosqlite pytest pytest-asyncio ruff
      - name: Career database and API tests
        env:
          PYTHONPATH: backend/job_service
        run: >-
          python -m pytest -q
          backend/job_service/tests/test_career.py
          backend/job_service/tests/test_career_migration.py
      - name: Career Python lint
        run: >-
          python -m ruff check --select F
          backend/job_service/app/routers/career.py
          backend/job_service/tests/test_career.py
          backend/job_service/tests/test_career_migration.py

  api-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gateway test dependencies
        run: >-
          python -m pip install -r backend/api_gateway/requirements.txt
          pytest ruff
      - name: Career gateway tests
        env:
          PYTHONPATH: backend/api_gateway
        run: >-
          python -m pytest -q
          backend/api_gateway/tests/test_career_auth.py
          backend/api_gateway/tests/test_career_workspace.py
      - name: Career Python lint
        run: >-
          python -m ruff check --select F
          backend/api_gateway/app/routes/career_workspace.py
          backend/api_gateway/tests/test_career_auth.py
          backend/api_gateway/tests/test_career_workspace.py
