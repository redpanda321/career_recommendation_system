apiVersion: v1
kind: ConfigMap
metadata: {name: career-compass-initdb, namespace: NAMESPACE_PLACEHOLDER}
data:
  init.sql: |
    CREATE DATABASE user_service_db;
    CREATE DATABASE job_service_db;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: career-compass-postgres-data, namespace: NAMESPACE_PLACEHOLDER}
spec: {accessModes: [ReadWriteOnce], storageClassName: local-path-retain, resources: {requests: {storage: 5Gi}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: career-compass-qdrant-data, namespace: NAMESPACE_PLACEHOLDER}
spec: {accessModes: [ReadWriteOnce], storageClassName: local-path-retain, resources: {requests: {storage: 5Gi}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: career-compass-career-ops-data, namespace: NAMESPACE_PLACEHOLDER}
spec: {accessModes: [ReadWriteOnce], storageClassName: local-path-retain, resources: {requests: {storage: 5Gi}}}
---
apiVersion: v1
kind: Secret
metadata: {name: career-compass-secrets, namespace: NAMESPACE_PLACEHOLDER}
type: Opaque
stringData:
  POSTGRES_PASSWORD: CAREER_DB_PASSWORD_PLACEHOLDER
  SECRET_KEY: CAREER_SECRET_KEY_PLACEHOLDER
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: career-compass-postgres, namespace: NAMESPACE_PLACEHOLDER}
spec:
  replicas: 1
  selector: {matchLabels: {app: career-compass-postgres}}
  template:
    metadata: {labels: {app: career-compass-postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:16
        env:
        - {name: POSTGRES_USER, value: career}
        - {name: POSTGRES_DB, value: postgres}
        - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: career-compass-secrets, key: POSTGRES_PASSWORD}}}
        ports: [{containerPort: 5432}]
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}, {name: initdb, mountPath: /docker-entrypoint-initdb.d}]
      volumes:
      - {name: data, persistentVolumeClaim: {claimName: career-compass-postgres-data}}
      - {name: initdb, configMap: {name: career-compass-initdb}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: career-compass-qdrant, namespace: NAMESPACE_PLACEHOLDER}
spec:
  replicas: 1
  selector: {matchLabels: {app: career-compass-qdrant}}
  template:
    metadata: {labels: {app: career-compass-qdrant}}
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant:v1.12.5
        ports: [{containerPort: 6333}]
        volumeMounts: [{name: data, mountPath: /qdrant/storage}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: career-compass-qdrant-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: career-compass-postgres, namespace: NAMESPACE_PLACEHOLDER}
spec: {selector: {app: career-compass-postgres}, ports: [{port: 5432, targetPort: 5432}]}
---
apiVersion: v1
kind: Service
metadata: {name: career-compass-qdrant, namespace: NAMESPACE_PLACEHOLDER}
spec: {selector: {app: career-compass-qdrant}, ports: [{port: 6333, targetPort: 6333}]}
---
apiVersion: v1
kind: List
items:
- apiVersion: v1
  kind: Service
  metadata: {name: career-compass-api, namespace: NAMESPACE_PLACEHOLDER}
  spec: {selector: {app: career-compass-api}, ports: [{port: 8000, targetPort: 8000}]}
- apiVersion: v1
  kind: Service
  metadata: {name: career-compass-user, namespace: NAMESPACE_PLACEHOLDER}
  spec: {selector: {app: career-compass-user}, ports: [{port: 8001, targetPort: 8001}]}
- apiVersion: v1
  kind: Service
  metadata: {name: career-compass-recommendation, namespace: NAMESPACE_PLACEHOLDER}
  spec: {selector: {app: career-compass-recommendation}, ports: [{port: 8002, targetPort: 8002}]}
- apiVersion: v1
  kind: Service
  metadata: {name: career-compass-embedding, namespace: NAMESPACE_PLACEHOLDER}
  spec: {selector: {app: career-compass-embedding}, ports: [{port: 8003, targetPort: 8003}]}
- apiVersion: v1
  kind: Service
  metadata: {name: career-compass-job, namespace: NAMESPACE_PLACEHOLDER}
  spec: {selector: {app: career-compass-job}, ports: [{port: 8004, targetPort: 8004}]}
- apiVersion: v1
  kind: Service
  metadata: {name: career-compass-vector, namespace: NAMESPACE_PLACEHOLDER}
  spec: {selector: {app: career-compass-vector}, ports: [{port: 8005, targetPort: 8005}]}
- apiVersion: v1
  kind: Service
  metadata: {name: career-compass-chatbot, namespace: NAMESPACE_PLACEHOLDER}
  spec: {selector: {app: career-compass-chatbot}, ports: [{port: 8006, targetPort: 8006}]}
- apiVersion: v1
  kind: Service
  metadata: {name: career-compass-frontend, namespace: NAMESPACE_PLACEHOLDER}
  spec: {selector: {app: career-compass-frontend}, ports: [{port: 8080, targetPort: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: career-compass-api, namespace: NAMESPACE_PLACEHOLDER}
spec:
  replicas: 1
  selector: {matchLabels: {app: career-compass-api}}
  template:
    metadata: {labels: {app: career-compass-api}}
    spec:
      imagePullSecrets: [{name: ghcr-credentials}]
      containers:
      - name: app
        image: IMAGE_PREFIX_PLACEHOLDER/hanggent-career-compass-api:TAG_PLACEHOLDER
        ports: [{containerPort: 8000}]
        env:
        - {name: SECRET_KEY, valueFrom: {secretKeyRef: {name: career-compass-secrets, key: SECRET_KEY}}}
        - {name: CAREER_ALLOWED_ORIGINS, value: https://staging.hangent.com}
        - {name: AUTH_SERVICE_URL, value: http://career-compass-user:8001/auth}
        - {name: USER_SERVICE_URL, value: http://career-compass-user:8001/users}
        - {name: JOB_SERVICE_URL, value: http://career-compass-job:8004/jobs}
        - {name: JOB_CAREER_SERVICE_URL, value: http://career-compass-job:8004/career-workspace}
        - {name: RECOMMEND_SERVICE_URL, value: http://career-compass-recommendation:8002/recommendations}
        - {name: CHATBOT_SERVICE_URL, value: http://career-compass-chatbot:8006/faq}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: career-compass-user, namespace: NAMESPACE_PLACEHOLDER}
spec:
  replicas: 1
  selector: {matchLabels: {app: career-compass-user}}
  template:
    metadata: {labels: {app: career-compass-user}}
    spec:
      imagePullSecrets: [{name: ghcr-credentials}]
      containers:
      - name: app
        image: IMAGE_PREFIX_PLACEHOLDER/hanggent-career-compass-user:TAG_PLACEHOLDER
        ports: [{containerPort: 8001}]
        env:
        - {name: SECRET_KEY, valueFrom: {secretKeyRef: {name: career-compass-secrets, key: SECRET_KEY}}}
        - {name: DATABASE_URL, value: postgresql+asyncpg://career:CAREER_DB_PASSWORD_PLACEHOLDER@career-compass-postgres:5432/user_service_db}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: career-compass-job, namespace: NAMESPACE_PLACEHOLDER}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: career-compass-job}}
  template:
    metadata: {labels: {app: career-compass-job}}
    spec:
      imagePullSecrets: [{name: ghcr-credentials}]
      containers:
      - name: app
        image: IMAGE_PREFIX_PLACEHOLDER/hanggent-career-compass-job:TAG_PLACEHOLDER
        ports: [{containerPort: 8004}]
        env:
        - {name: SECRET_KEY, valueFrom: {secretKeyRef: {name: career-compass-secrets, key: SECRET_KEY}}}
        - {name: DATABASE_URL, value: postgresql+asyncpg://career:CAREER_DB_PASSWORD_PLACEHOLDER@career-compass-postgres:5432/job_service_db}
        - {name: EMBEDDING_SERVICE_URL, value: http://career-compass-embedding:8003/embed/job}
        - {name: VECTORDB_SERVICE_URL, value: http://career-compass-vector:8005/store}
        - {name: CAREER_OPS_DATA_ROOT, value: /app/career-ops-data}
        volumeMounts: [{name: career-ops-data, mountPath: /app/career-ops-data}]
      volumes: [{name: career-ops-data, persistentVolumeClaim: {claimName: career-compass-career-ops-data}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: career-compass-embedding, namespace: NAMESPACE_PLACEHOLDER}
spec:
  replicas: 1
  selector: {matchLabels: {app: career-compass-embedding}}
  template:
    metadata: {labels: {app: career-compass-embedding}}
    spec: {imagePullSecrets: [{name: ghcr-credentials}], containers: [{name: app, image: IMAGE_PREFIX_PLACEHOLDER/hanggent-career-compass-embedding:TAG_PLACEHOLDER, ports: [{containerPort: 8003}]}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: career-compass-vector, namespace: NAMESPACE_PLACEHOLDER}
spec:
  replicas: 1
  selector: {matchLabels: {app: career-compass-vector}}
  template:
    metadata: {labels: {app: career-compass-vector}}
    spec:
      imagePullSecrets: [{name: ghcr-credentials}]
      containers:
      - name: app
        image: IMAGE_PREFIX_PLACEHOLDER/hanggent-career-compass-vector:TAG_PLACEHOLDER
        ports: [{containerPort: 8005}]
        env: [{name: ENV, value: Development}, {name: QDRANT_URL, value: http://career-compass-qdrant:6333}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: career-compass-recommendation, namespace: NAMESPACE_PLACEHOLDER}
spec:
  replicas: 1
  selector: {matchLabels: {app: career-compass-recommendation}}
  template:
    metadata: {labels: {app: career-compass-recommendation}}
    spec:
      imagePullSecrets: [{name: ghcr-credentials}]
      containers:
      - name: app
        image: IMAGE_PREFIX_PLACEHOLDER/hanggent-career-compass-recommendation:TAG_PLACEHOLDER
        ports: [{containerPort: 8002}]
        env: [{name: EMBEDDING_SERVICE, value: http://career-compass-embedding:8003/embed}, {name: VECTOR_SERVICE, value: http://career-compass-vector:8005}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: career-compass-chatbot, namespace: NAMESPACE_PLACEHOLDER}
spec:
  replicas: 1
  selector: {matchLabels: {app: career-compass-chatbot}}
  template:
    metadata: {labels: {app: career-compass-chatbot}}
    spec: {imagePullSecrets: [{name: ghcr-credentials}], containers: [{name: app, image: IMAGE_PREFIX_PLACEHOLDER/hanggent-career-compass-chatbot:TAG_PLACEHOLDER, ports: [{containerPort: 8006}]}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: career-compass-frontend, namespace: NAMESPACE_PLACEHOLDER}
spec:
  replicas: 1
  selector: {matchLabels: {app: career-compass-frontend}}
  template:
    metadata: {labels: {app: career-compass-frontend}}
    spec: {imagePullSecrets: [{name: ghcr-credentials}], containers: [{name: app, image: IMAGE_PREFIX_PLACEHOLDER/hanggent-career-compass-frontend:TAG_PLACEHOLDER, ports: [{containerPort: 8080}]}]}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: career-compass-api-strip, namespace: NAMESPACE_PLACEHOLDER}
spec: {stripPrefix: {prefixes: [/career-compass/api]}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: career-compass
  namespace: NAMESPACE_PLACEHOLDER
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: NAMESPACE_PLACEHOLDER-career-compass-api-strip@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: staging.hangent.com
    http:
      paths:
      - {path: /career-compass/api, pathType: Prefix, backend: {service: {name: career-compass-api, port: {number: 8000}}}}
      - {path: /career-compass, pathType: Prefix, backend: {service: {name: career-compass-frontend, port: {number: 8080}}}}
